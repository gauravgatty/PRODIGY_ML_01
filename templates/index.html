<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🏠 House Price Prediction</h1>

        <p class="subtitle">
            Predict house prices using Machine Learning
        </p>

        <form action="/predict" method="POST">

    <div class="input-group">

        <label>Square Feet</label>

        <input
            type="number"
            name="square_feet"
            value="{{ square_feet if square_feet else '' }}"
            required
        >

    </div>

    <div class="input-group">

        <label>Number of Bedrooms</label>

        <input
            type="number"
            name="bedrooms"
            value="{{ bedrooms if bedrooms else '' }}"
            required
        >

    </div>

    <div class="input-group">

        <label>Number of Bathrooms</label>

        <input
            type="number"
            name="bathrooms"
            value="{{ bathrooms if bathrooms else '' }}"
            required
        >

    </div>

    <button type="submit">
        Predict Price
    </button>

</form>

        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}

    </div>

</body>

</html>
